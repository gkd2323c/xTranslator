name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        override: true
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev
        
    - name: Run unit tests
      run: cargo test --workspace --lib --verbose
      
    - name: Run integration tests
      run: cargo test --workspace --test '*' --verbose
      
    - name: Run E2E tests (if Skyrim data available)
      run: |
        if [ -f "tests/fixtures/skyrim_test_data.esm" ]; then
          cargo test --release -p xt-core --test e2e_comprehensive
          cargo test --release -p xt-core --test performance_benchmarks
        else
          echo "⚠️  Skipping E2E tests - Skyrim test data not available"
        fi
      shell: bash
      
    - name: Generate code coverage
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --workspace --lib --test '*' --out Xml --output-dir ./coverage
        
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  test-frontend:
    name: Frontend Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install dependencies
      working-directory: ./ui
      run: npm ci
      
    - name: Run TypeScript type checking
      working-directory: ./ui
      run: npm run build --if-present
      
    - name: Run unit tests
      working-directory: ./ui
      run: npm test
      
    - name: Run E2E tests
      working-directory: ./ui
      run: |
        npm run build
        npm run test:e2e
      env:
        VITE_E2E: true

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Run performance benchmarks
      run: |
        if [ -f "tests/fixtures/skyrim_test_data.esm" ]; then
          cargo test --release -p xt-core --test performance_benchmarks -- --nocapture
        else
          echo "⚠️  Skipping performance tests - Skyrim test data not available"
        fi
      shell: bash
      
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          target/release/deps/benchmark-*.log
          performance-report.json

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Check code formatting
      run: cargo fmt --all -- --check
      
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci
      
    - name: Check frontend code quality
      working-directory: ./ui
      run: |
        npm run lint --if-present
        npm run type-check --if-present

  build-test:
    name: Build Test
    runs-on: ${{ matrix.os }}
    needs: [test-backend, test-frontend]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci
      
    - name: Build frontend
      working-directory: ./ui
      run: npm run build
      
    - name: Build backend
      run: cargo build --workspace --release

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, performance-tests, code-quality, build-test]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' }}
      run: |
        echo "✅ All tests passed successfully!"
        
    - name: Notify failure
      if: ${{ needs.test-backend.result == 'failure' || needs.test-frontend.result == 'failure' }}
      run: |
        echo "❌ Some tests failed!"
        exit 1
