name: Full Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Cross-platform Backend Tests ─────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        override: true

    - name: Cache Cargo registry
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./crates/*"

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Run unit tests
      run: cargo test --workspace --lib --verbose

    - name: Run integration tests
      run: cargo test --workspace --test '*' --verbose

    - name: Run E2E/benchmarks (if Skyrim data available)
      run: |
        if [ -f "tests/fixtures/skyrim_test_data.esm" ]; then
          cargo test --release -p xt-core --test e2e_comprehensive
          cargo test --release -p xt-core --test performance_benchmarks
        else
          echo "⚠️  Skipping E2E tests - Skyrim test data not available"
        fi
      shell: bash

    - name: Generate code coverage
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --workspace --lib --test '*' --out Xml --output-dir ./coverage

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella

  # ── Cross-platform Frontend Tests ───────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      working-directory: ./ui
      run: npm ci

    - name: TypeScript type check
      working-directory: ./ui
      run: npx tsc --noEmit

    - name: Unit tests
      working-directory: ./ui
      run: npm test

    - name: E2E tests
      working-directory: ./ui
      run: |
        npm run build
        npm run test:e2e
      env:
        VITE_E2E: true

  # ── Performance Benchmarks ──────────────────────────────────────
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./crates/*"

    - name: Run performance benchmarks
      run: |
        if [ -f "tests/fixtures/skyrim_test_data.esm" ]; then
          cargo test --release -p xt-core --test performance_benchmarks -- --nocapture
        else
          echo "⚠️  Skipping performance tests - Skyrim test data not available"
        fi
      shell: bash

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          target/release/deps/benchmark-*.log
          performance-report.json

  # ── Code Quality ────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./crates/*"

    - name: Formatting check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci

    - name: Frontend lint
      working-directory: ./ui
      run: |
        npm run lint --if-present
        npx tsc --noEmit

  # ── Cross-platform Build ────────────────────────────────────────
  build-test:
    name: Build Test
    runs-on: ${{ matrix.os }}
    needs: [test-backend, test-frontend]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./crates/*"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci

    - name: Build frontend
      working-directory: ./ui
      run: npm run build

    - name: Build backend
      run: cargo build --workspace --release

  # ── Notification ────────────────────────────────────────────────
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, performance-tests, code-quality, build-test]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "✅ Backend: ${{ needs.test-backend.result }}"
        echo "✅ Frontend: ${{ needs.test-frontend.result }}"
        echo "✅ Performance: ${{ needs.performance-tests.result }}"
        echo "✅ Quality: ${{ needs.code-quality.result }}"
        echo "✅ Build: ${{ needs.build-test.result }}"
