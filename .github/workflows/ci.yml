name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust Backend Tests ──────────────────────────────────────────
  test:
    name: Rust Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates/*"

      - name: Run tests
        run: |
          cargo test -p xt-core --lib
          cargo test -p xt-shared --lib

  # ── Rust Build ──────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p xtranslator-tauri --release

  # ── Frontend Tests ──────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Clippy Lint ─────────────────────────────────────────────────
  lint:
    name: Clippy Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2

      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
