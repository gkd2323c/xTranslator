[workspace]
resolver = "2"
members = [
    "crates/xt-core",
    "crates/xt-shared",
    "crates/xt-cli",
    "src-tauri",
    "tests",
]

[workspace.package]
version = "1.2.0"
authors = ["xTranslator Team"]
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
# 二进制处理
byteorder = "1.5"

# 压缩解压
flate2 = { version = "1.0", features = ["zlib-ng"] }

# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# 并发
rayon = "1.8"

# 序列化
serde = { version = "1.0", features = ["derive"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 哈希
fnv = "1.0"
ahash = "0.8"

# 工具
regex = "1.10"
once_cell = "1.19"
quick-xml = "0.39"
log = "0.4"

# 编码
encoding_rs = "0.8"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# 异步 trait
async-trait = "0.1"

# 缓存
bincode = "1.3"
sha2 = "0.10"

# 注意：tauri / tauri-build 不在此声明
# 由 src-tauri/Cargo.toml 单独管理
